
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111116;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    .container {
      max-width: 700px;
      animation: appear 2s ease forwards;
    }

    .heart {
      font-size: 38px;
      color: #c7859a;
      margin-bottom: 45px;
    }

    h1 {
      font-size: clamp(26px, 5vw, 42px);
      line-height: 1.4;
      margin-bottom: 45px;
    }

    p {
      font-size: clamp(18px, 3vw, 25px);
      line-height: 1.7;
      color: #e4e4e7;
    }

    .small-heart {
      color: #9999a3;
      font-size: 22px;
      margin-top: 55px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="heart">♡</div>

    <h1>Madem buraya tekrar geldin...</h1>

    <p>Eğer benimle konuşmak istersen, beni ara.</p>

    <div class="small-heart">♡</div>
  </div>
</body>
</html>
