 const d=s.d,pool=menu.filter(available),newest=Math.max(...pool.map(r=>r.lv));

 const ppl=guests.map((g,i)=>i).filter(i=>i<Math.min(yusuf,8+d.n)&&!s.recent.includes(i)&&!d.queue.some(j=>j.who===i)&&s.job?.who!==i);
 if(!ppl.length)return;
 const regular=ppl.filter(i=>stories[i]&&s.friends[i]<stories[i].length);
 const yusufDue=d.n%3===2&&d.arrivals===1&&s.lastYusufDay!==d.n;
 const who=yusufDue?yusuf:!s.count&&!d.arrivals?0:pick(regular.length&&d.arrivals%3===0?regular:ppl);
 if(who===yusuf)s.lastYusufDay=d.n;
 s.recent=[...s.recent,who].slice(-3);s.visits[who]++;
 const chapter=stories[who]&&s.friends[who]<stories[who].length&&(who===yusuf||d.arrivals%3===0||Math.random()<.45)?s.friends[who]:-1;
 const reunion=stories[who]&&s.friends[who]>=stories[who].length&&(who===yusuf||Math.random()<.45)?catchUp(who):null;
 d.arrivals++;d.queue.push({who,recipe:menu.indexOf(recipe),id:d.arrivals,step:0,errors:0,stage:'hello',chat:false,chapter,reunion,deadline:d.minutes+29+(d.staff.includes('runner')?10:0)});
}
function advance(minutes){
 const d=s.d;for(let i=0;i<minutes;i++){d.minutes++;
 const keep=d.queue.filter(j=>j.deadline>d.minutes);d.lost+=d.queue.length-keep.length;d.queue=keep;
 if(d.arrivals<target()&&d.minutes>=d.next){arrival();d.next=d.minutes+gap();if(d.n>=4&&d.arrivals<target()&&d.arrivals%5===2)arrival()}
 }}
function dispatch(){
 const d=s.d;s.job=null;
 if(!d.queue.length&&d.arrivals<target()){if(d.next<=d.minutes){arrival();d.next=d.minutes+gap()}else advance(d.next-d.minutes)}
 s.job=d.queue.shift()||null;
}
function commit(){try{localStorage.setItem(key,JSON.stringify(s));saved=true}catch{saved=false}render()}
function button(parent,label,action,primary=false,disabled=false){const b=document.createElement('button');b.textContent=label;b.disabled=disabled;if(primary)b.className='primary';b.onclick=action;parent.append(b);return b}
function answer(chat){
 const j=s.job;if(j.stage!=='hello')return;j.chat=chat;
 if(chat){if(j.who===yusuf&&j.chapter===1&&!s.roseGiven)s.roseGiven=true;s.friends[j.who]++;if(j.reunion){s.lastTalk??={};s.lastTalk[j.who]=j.reunion.index}advance(3)}
 advance(1);j.step=s.d.staff.includes('baker')?1:0;j.stage=j.step===menu[j.recipe].items.length?'cook':'mix';
 note=j.step?'Deniz ilk malzemeyi hazırladı.':'';commit()
}
function add(item){const j=s.job,r=menu[j.recipe];if(j.stage!=='mix')return;
 if(item!==r.items[j.step]){advance(2);j.errors++;note='Sıradaki malzeme: '+r.items[j.step]+'.'}
 else{advance((['Çekirdek','İnce kahve'].includes(item)&&s.owned.includes('grinder')||item==='Un'&&s.owned.includes('mixer'))?1:2);j.step++;note=item+' eklendi.';if(j.step===r.items.length){j.stage='cook';note='Son hazırlama adımına geç.'}}commit()}
function finish(){const j=s.job;if(j.stage!=='cook')return;advance(s.owned.includes('press')&&menu[j.recipe].items.includes('Çekirdek')&&!menu[j.recipe].need.includes('oven')?1:4);j.stage='ready';note='Sipariş hazır.';commit()}
function serve(){const j=s.job;if(j.stage!=='ready')return;const prev=level(),r=menu[j.recipe],d=s.d;advance(1);
 const tip=Math.max(0,(j.chat?3:1)+Math.min(3,s.friends[j.who])-j.errors)+(s.owned.includes('plant')?2:0);
 const xp=8+(s.owned.includes('awning')?2:0);d.sales+=r.price;d.tips+=tip;d.ingredients+=Math.ceil(r.price*.36)+j.errors;d.served++;
 s.coins+=r.price+tip;s.xp+=xp;s.count++;j.stage='paid';j.receipt=r.price+' ₺ satış + '+tip+' ₺ bahşiş · +'+xp+' XP';j.unlock=level()>prev?'Seviye '+level()+' açıldı! Tariflere ve dükkâna göz at.':'';note='';commit()}
function closeDay(){const d=s.d;if(d.closed||d.queue.length||d.arrivals<target()||s.job?.stage!=='paid'&&s.job)return;
 d.closed=true;s.coins-=d.ingredients+rent()+wage();d.balance=s.coins;s.history.push({day:d.n,net:d.sales+d.tips-d.ingredients-rent()-wage(),served:d.served});s.history=s.history.slice(-7);s.job=null;commit()}
function newDay(){if(!s.d.closed)return;const staff=[...document.querySelectorAll('#shiftstaff input:checked')].map(e=>e.value);s.d=blankDay(s.d.n+1,s.coins);s.d.staff=staff;note='';dispatch();commit()}
function buy(k){const [,lv,cost]=gear[k];if(s.owned.includes(k)||level()<lv||s.coins<cost||s.d.closed)return;s.coins-=cost;s.d.invest+=cost;s.owned.push(k);commit()}
function report(){const d=s.d;$('summaryTitle').textContent=d.n+'. günün hesabı';$('ledger').replaceChildren();
 for(const [name,v] of [['Açılış kasası',d.opening],['Satışlar',d.sales],['Bahşişler',d.tips],['Malzeme ve fire',-d.ingredients],['Kira ve enerji',-rent()],['Personel',-wage()],['İşletme kârı',s.history.at(-1).net],['Ekipman ve işe alım',-d.invest],['Kapanış kasası',d.balance]]){const row=document.createElement('div');row.className='row';const a=document.createElement('span'),b=document.createElement('b');a.textContent=name;b.textContent=v+' ₺';row.append(a,b);$('ledger').append(row)}

}

 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));$('bar').hidden=tab!=='bar';$('library').hidden=tab==='bar';if(tab!=='bar'){catalog();return}

 $('speech').textContent='“'+(j.stage==='hello'?(chapter?.[0]||quick[(j.who+s.visits[j.who])%quick.length]):j.stage==='paid'?'Eline sağlık, Sıla.':j.chat&&chapter?chapter[2]:'Teşekkürler, burada bekliyorum.')+'”';$('order').textContent=j.stage==='paid'?j.receipt:'Bir '+r.name+' alabilir miyim?';$('talk').replaceChildren();

 if(j.stage==='paid'){const last=d.arrivals===target()&&!d.queue.length;button($('talk'),last?'Kasayı kapat →':'Sıradaki müşteri →',()=>{note='';if(last)closeDay();else{dispatch();commit()}},true)}

 if(book)for(const r of menu){const missing=r.need.filter(k=>!s.owned.includes(k));card('SV. '+r.lv+' · '+(available(r)?'MENÜDE':level()<r.lv?'KİLİTLİ':'EKİPMAN GEREKİYOR'),r.name,r.items.join(' → ')+' → '+r.finish,gear[r.need.at(-1)][0]+' · '+r.price+' ₺'+(missing.length?' · Gereken: '+missing.map(k=>gear[k][0]).join(', '):''))}
 else for(const [k,[name,lv,cost,desc]] of Object.entries(gear).sort((a,b)=>a[1][1]-b[1][1])){const own=s.owned.includes(k),locked=level()<lv,poor=s.coins<cost;const el=card('SEVİYE '+lv,name,desc,own?'Kafende kurulu':cost+' ₺');if(!own)button(el,locked?'Seviye '+lv+' gerekli':poor?(cost-s.coins)+' ₺ eksik':'Satın al',()=>buy(k),true,locked||poor)}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
document.addEventListener('keydown',e=>{if(tab!=='bar'||e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(/^[1-6]$/.test(e.key))$('stock').children[Number(e.key)-1]?.click();if(e.key==='Enter'&&document.activeElement.tagName!=='BUTTON')$('tools').firstChild?.click()});
