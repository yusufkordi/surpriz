<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Küçük Bir Şey :)</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #120018, #39002e, #76004f);
      color: white;
    }

    .box {
      text-align: center;
      z-index: 10;
      padding: 30px;
    }

    h1 {
      font-size: 55px;
      margin-bottom: 10px;
      opacity: 0;
      transform: scale(0.5);
      transition: 1s;
      text-shadow: 0 0 25px rgba(255, 100, 180, 0.8);
    }

    p {
      font-size: 21px;
      opacity: 0;
      transition: 1s;
    }

    button {
      padding: 15px 28px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      background: white;
      color: #76004f;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
    }

    .show {
      opacity: 1;
      transform: scale(1);
    }

    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 25px;
      animation: fly 5s linear forwards;
      pointer-events: none;
    }

    @keyframes fly {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="box">

    <button id="button" onclick="surprise()">
      Buraya tıkla :)
    </button>

    <h1 id="name"></h1>

    <p id="message">
      Bunu görünce biraz gülümsersen görev tamamdır :)
    </p>

  </div>

  <script>


    const isim = "SILA";

    function surprise() {

      document.getElementById("button").style.display = "none";

      const name = document.getElementById("name");
      const message = document.getElementById("message");

      name.innerText = isim + " ❤️";

      setTimeout(() => {
        name.classList.add("show");
      }, 300);

      setTimeout(() => {
        message.classList.add("show");
      }, 1200);

      setInterval(createHeart, 250);
    }

    function createHeart() {

      const heart = document.createElement("div");

      heart.className = "heart";
      heart.innerHTML = ["❤️","💗","💕","💖"][Math.floor(Math.random() * 4)];

      heart.style.left = Math.random() * 100 + "vw";

      heart.style.fontSize =
        (Math.random() * 25 + 15) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

  </script>

</body>
</html>
